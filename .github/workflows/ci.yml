name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build pkg-config \
            libglib2.0-dev libbluetooth-dev
      - name: Configure
        run: meson setup daemon/build daemon --buildtype=debug -Dwerror=true -Dwarning_level=3
      - name: Build
        run: meson compile -C daemon/build
      - name: Test
        run: meson test -C daemon/build --print-errorlogs
      - name: Check installer syntax
        run: bash -n install.sh
